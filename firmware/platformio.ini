[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:embed_page.py
board_build.embed_files = embed/page.html.gz
lib_deps =
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson@^7
    stm32duino/STM32duino VL53L4CD@^1.0.5
    links2004/WebSockets@^2.6.1
